h+=`<div class="it"><b>${g.ic} ${g.n}</b> <span class="dim">(${g.t=='w'?'سلاح':'رداء'} · ${st})</span><br>⚡ ${g.p}<br>${own?'':costH(g.c)+'<br>'}${btn}</div>`}}
else if(tab==1){Q.forEach((q,i)=>{h+=`<div class="it ${i>qi?'dim':''}">${i<qi?'✅':i==qi?'▶️':'🔒'} ${qt(q)} · +${q.xp} خبرة${i==qi?` (${qp}/${q.n})`:''}</div>`})}
else if(tab==3){h+=vil()}else if(tab==4){h+=stt()}else if(tab==5){h+=team()}else if(tab==6){h+=frT()}else{for(const k in M){const m=M[k];h+=`<div class="it"><b>${m.e} ${m.n}</b> ${'★'.repeat(m.s)}<br>${Z[m.z][0]} · صحة ${m.hp} · ضرر ${m.d}<br>نقطة الضعف: <b>${EL[m.w]}</b>${m.r?' · يقاوم: '+EL[m.r]:''}<br>يسقط: ${m.dr.map(d=>IT[d[0]]).join('، ')}</div>`}}
pn.innerHTML=h;pn.style.display='block'}
function cl(){pn.style.display='none';atk=false}
function tp(){P.x=1000;P.y=860;cl();toast('🌀 عدت إلى القرية')}
function mk(k){const g=G[k];for(const i in g.c)P.inv[i]-=g.c[i];P.own[k]=1;eqp(k,1);prog('craft',null);toast('🔨 صنعت '+g.n,'#f0b445');sfx(400,.3,'sawtooth',.06,800)}
function eqp(k,s){if(G[k].t=='w')P.w=k;else P.a=k;menu()}
$('#mb').onclick=()=>pn.style.display=='block'?cl():menu();
</script></body></html>
